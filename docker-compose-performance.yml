# Stack de test de performance ISOLÉE pour le BFF Settings.
#
#   ./performance_test.sh          (local)
#   docker compose -f docker-compose-performance.yml up --build \
#       --abort-on-container-exit --exit-code-from k6-perf-test   (CI)
#
# k6-perf-test sort en échec si un seuil de load-test.js est dépassé.
# TARGET_IMAGE (optionnel) : image BFF pré-construite à tester au lieu du build local.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:1.3.0}
    container_name: bff-settings-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:1.3.0}
    container_name: bff-settings-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-settings-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-settings-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:1.2.0}
    container_name: bff-settings-perf-core-api
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core:3000
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-ready ci-dessous.

  core-ready:
    image: curlimages/curl:latest
    container_name: bff-settings-perf-core-ready
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:0.5.0}
    container_name: bff-settings-perf-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      JWT_SECRET: 'b"secret"'
      CORE_API_URL: http://core:3000
    expose:
      - "4000"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  bff-settings:
    image: ${TARGET_IMAGE:-bff-settings:perf}
    container_name: bff-settings-perf-bff
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - node_auth_token
    depends_on:
      core-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core:3000
    expose:
      - "4008"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: bff-settings-perf-k6
    depends_on:
      bff-settings:
        condition: service_healthy
      bff-user:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
    environment:
      BASE_URL: http://bff-settings:4008
      JWT_SECRET: b"secret"
      PERF_USER_ID: "2"
    command: ["run", "/load-test.js"]
    networks:
      - backend

# Isolated performance test stack for the BFF Settings.
#
#   ./performance_test.sh                 (local)
#   IMAGE_REF=<image> ./performance_test.sh   (CI: the image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by
# IMAGE_REF, which the CI sets to the dev image built once by release-dev and
# then promoted to staging and prod. When IMAGE_REF is empty, the script builds
# bff-settings:local from development.Dockerfile first (NODE_AUTH_TOKEN and ./.npmrc
# are needed to read the @mairie360/* packages).
#
# k6-perf-test fails when a threshold of load-test.js is exceeded.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-99f6127}
    container_name: bff-settings-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-99f6127}
    container_name: bff-settings-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-settings-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
      # Volume seed of the load test (MAIR-474): BFF_user's Core seed, 10 000 agents with their sessions.
      - ./init-perf.sql:/init-perf.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql -f /init-perf.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-settings-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-abaa6c2}
    container_name: bff-settings-perf-core-api
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      EMAIL_FROM: "noreply.mairie360@test.local"
      SMTP_HOST: "localhost"
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-ready ci-dessous.

  core-ready:
    image: curlimages/curl:latest
    container_name: bff-settings-perf-core-ready
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend


  bff-settings:
    image: ${IMAGE_REF:-bff-settings:local}
    container_name: bff-settings-perf-bff
    depends_on:
      core-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core:3000
      # Verifies the session tokens before any Core call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4008"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: bff-settings-perf-k6
    depends_on:
      bff-settings:
        condition: service_healthy
    # load-test.js declares one handler per operation of the contract through the shared OpenAPI
    # coverage module (mairie360/CICD tests/k6/coverage.js, cloned into cicd-repo/ by
    # performance_test.sh or checked out by the CI job): k6 aborts at init when an operation has no
    # handler, and fails its `operations_uncovered` threshold when a handler does not send its request.
    volumes:
      - ./load-test.js:/load-test.js:ro
      # The committed contract is the coverage reference (contracts:check keeps it equal to the
      # document served by the BFF).
      - ./contracts/openapi.json:/openapi.json:ro
      - ./cicd-repo/tests/k6/coverage.js:/coverage.js:ro
    environment:
      BASE_URL: http://bff-settings:4008
      # Load profile of load-test.js: `ci` (default, sized for the 4 vCPU CI runner) or `stress` (MAIR-474).
      K6_PROFILE: ${K6_PROFILE:-ci}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    command: ["run", "/load-test.js"]
    networks:
      - backend

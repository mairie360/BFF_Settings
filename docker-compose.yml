services:
  bff-settings:
    build: .
    ports:
      - "4008:4008"
    environment:
      PORT: 4008
      CORE_API_URL: ${CORE_API_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 30s
      timeout: 5s
      retries: 3

# Integration test stack of the BFF Settings (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Core API image, seeded database, Redis) plus a `newman` runner that replays the
# committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-settings:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.4.0}
    container_name: bff-settings-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.4.0}
    container_name: bff-settings-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    container_name: bff-settings-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: bff-settings-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:dev-3b40c2a}
    container_name: bff-settings-int-core-api
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with this run's Ed25519 key pair from
      # stack_secrets.sh; no JWT_SECRET, so no HS256 token is accepted anywhere in the stack.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      # Core's rate limits stay on here (unlike the ZAP and k6 stacks, MAIR-425): the collection signs
      # nobody in, so only the MAIR-746 journey spends a budget, the administrator's password checks.
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core:3000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-ready ci-dessous.

  core-ready:
    image: curlimages/curl:latest@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
    container_name: bff-settings-int-core-ready
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend


  bff-settings:
    image: ${IMAGE_REF:-bff-settings:local}
    container_name: bff-settings-int-bff
    depends_on:
      core-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core:3000
      # Verifies the session tokens before any Core call (bffs-lib requireSession, MAIR-474).
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4008"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-settings` service. `baseUrl` and the EdDSA JWTs
  # integration_test.sh signs (MAIR-680) are injected here so the committed environment stays usable from a host shell. The reports
  # (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine@sha256:d9b5e780ead0026bbb37f3759cd7b10fc8a88cd4030c8266a7c5e343d75a5198
    container_name: bff-settings-int-newman
    depends_on:
      bff-settings:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-settings:4008
      --env-var jwt_admin=${JWT_ADMIN:?JWT_ADMIN must be set, run ./integration_test.sh}
      --env-var jwt_agent=${JWT_AGENT:?JWT_AGENT must be set, run ./integration_test.sh}
      --env-var jwt_forged=${JWT_FORGED:?JWT_FORGED must be set, run ./integration_test.sh}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend

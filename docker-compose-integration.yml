# Integration test stack of the BFF Settings (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Core API image, seeded database, Redis) plus a `newman` runner that replays the
# committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-settings:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-settings-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-settings-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-settings-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-settings-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-settings-int-core-api
    depends_on:
      seeder:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the scan and the load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-ready ci-dessous.

  core-ready:
    image: curlimages/curl:latest
    container_name: bff-settings-int-core-ready
    depends_on:
      core:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core:3000/ready >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend


  bff-settings:
    image: ${IMAGE_REF:-bff-settings:local}
    container_name: bff-settings-int-bff
    depends_on:
      core-ready:
        condition: service_completed_successfully
    environment:
      PORT: 4008
      CORE_API_URL: http://core:3000
      # Verifies the session tokens before any Core call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4008"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4008/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-settings` service. `baseUrl` and the JWT_SECRET
  # of the run are injected here so the committed environment stays usable from a host shell. The reports
  # (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: bff-settings-int-newman
    depends_on:
      bff-settings:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --env-var baseUrl=http://bff-settings:4008
      --env-var jwt_secret=${JWT_SECRET}
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
